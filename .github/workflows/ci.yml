name: CI

on:
  pull_request:
  push:
    # Feature branches and the staging branch too, so the database tests run on a real Supabase before any PR.
    branches: [main, "feat/**", "claude-101"]

permissions:
  contents: read

jobs:
  app:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - name: Build
        run: bun run build
        env:
          # Placeholders: the build only checks these are set; nothing connects to them.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Database security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # A real local Supabase (database, auth and storage) with every migration applied.
      # The storage service creates the storage tables the photo policies are written for.
      - run: >
          bunx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,mailpit
      - run: bun run test:rls
